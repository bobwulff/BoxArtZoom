<style>
/* Layout: single phone-width column. Black header band, full-bleed square art viewer, then controls on black. Single dark look, by choice. */
:root{
  --bg:#000; --viewer:#2e3140; --track:#383838; --divider:#2a2a2a;
  --pink:#ec3a8f; --green:#3cbf82; --input:#2d5966;
  --fg:#fff; --muted:#9a9ca3; --chip:rgba(255,255,255,.75); --chipInk:#000;
  --title:"Tiny5","Press Start 2P",ui-monospace,monospace;
  --pixel:"Tiny5",ui-monospace,monospace;
  --button:"Press Start 2P",ui-monospace,monospace;
  --entry:"Jersey 25","Tiny5",ui-monospace,monospace;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg);height:100%}
body{font-family:var(--pixel);font-size:16px}
.app{max-width:480px;margin:0 auto;display:flex;flex-direction:column;min-height:100%;overflow-x:clip}
.controls{flex:none}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

header{position:relative;z-index:0;padding-block:30px 16px}
h1{display:inline-flex;align-items:baseline;font-weight:400;margin:0;line-height:1;white-space:nowrap;font-size:40px}
h1 .box{font-family:"Jersey 25","Tiny5",ui-monospace,monospace;font-size:1.75em;letter-spacing:.02em;vertical-align:baseline}
h1 .zoom{position:relative;font-family:"Press Start 2P",ui-monospace,monospace;font-size:1em;margin-left:.2em;color:transparent}
h1 .zoom.lit{color:var(--fg)}
/* BETA tag sitting on top of ZOOM, right-aligned (same as Meta Critical) */
h1 .beta{position:absolute;right:0;bottom:calc(100% - .55em);z-index:1;font-family:"Press Start 2P",ui-monospace,monospace;font-size:clamp(9px,2.6vw,12px);line-height:1;padding:.35em .45em .3em;background:var(--pink);color:#fff;text-shadow:none;letter-spacing:.04em}

.viewer{position:relative;z-index:1;width:100%;max-width:100%;height:0;padding-top:100%;flex:none;background:var(--viewer);overflow:hidden}
.viewer img{position:absolute;left:0;top:0;max-width:none;max-height:none;transform-origin:0 0;user-select:none;-webkit-user-drag:none}
.viewer.pix img{image-rendering:pixelated}
/* Last round: the frame behind the cover pulses a soft red, like a heartbeat */
.viewer.last{animation:heartbeat 1.6s ease-in-out infinite}
@keyframes heartbeat{0%,40%,100%{background-color:var(--viewer)}12%{background-color:#6e2a36}20%{background-color:#4a2c38}28%{background-color:#5e2a35}}
@media (prefers-reduced-motion:reduce){.viewer.last{animation:none;background-color:#4a2c38}}
.viewer .loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--pixel);color:var(--muted);font-size:16px}
.clues{position:absolute;left:16px;right:16px;bottom:16px;display:flex;flex-wrap:wrap;gap:2px}
.chip{font-family:var(--pixel);font-size:14px;line-height:1;padding:6px 10px;min-width:72px;max-width:100%;line-height:1.2;box-sizing:border-box;text-align:center;background:var(--chip);color:var(--chipInk);letter-spacing:.06em}

.controls{display:flex;flex-direction:column;gap:10px;padding-block:12px 24px}

.deaths{position:relative;height:28px;background:var(--track);display:grid;grid-template-columns:repeat(5,1fr)}
.deaths i{border-left:2px solid var(--divider)}
.deaths i:first-child{border-left:0}
.deaths .fill{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--pink);display:flex;align-items:center;font-family:var(--button);font-size:11px;white-space:nowrap;overflow:hidden;transition:width .45s steps(9,end)}
.deaths .fill span{padding-left:12px}
.deaths .fill.instant{transition:none}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:50;image-rendering:pixelated}
.flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;z-index:60}
.flash.go{animation:flash2 .34s steps(1,end)}
@keyframes flash2{0%{opacity:.25}20%{opacity:0}40%{opacity:.25}60%,100%{opacity:0}}
.app.shake>:not(#confetti):not(.flash){animation:shake .5s cubic-bezier(.36,.07,.19,.97)}   /* shake the content, not the full-screen layers */
@keyframes shake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(4px,-2px)}30%,50%,70%{transform:translate(-7px,2px)}40%,60%{transform:translate(7px,-1px)}100%{transform:none}}
@media (prefers-reduced-motion:reduce){.deaths .fill{transition:none}}
.deaths .zero{position:absolute;left:12px;top:0;bottom:0;display:flex;align-items:center;font-family:var(--button);font-size:11px;color:var(--muted)}

.entry{height:58px;background:var(--input);display:flex;align-items:center}
.entry input{flex:1;min-width:0;height:100%;border:0;background:transparent;color:var(--fg);font-family:var(--entry);font-size:30px;padding:0 12px;outline:none}
.entry input::placeholder{color:var(--muted);opacity:1}
.entry:focus-within{box-shadow:inset 0 0 0 3px var(--green)}
.entry .win{flex:1;text-align:center;font-family:var(--entry);font-size:44px;line-height:1;color:var(--fg)}

.suggest{list-style:none;margin:-10px 0 0;padding:0;background:var(--input);max-height:220px;overflow:auto;border-top:2px solid var(--bg)}
.suggest li{padding:10px 12px;cursor:pointer;font-family:var(--entry);font-size:22px;color:var(--fg)}
.suggest li.on,.suggest li:hover{background:rgba(255,255,255,.12)}

.buttons{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.buttons.one{grid-template-columns:1fr}
button{height:48px;border:0;cursor:pointer;font-family:var(--button);font-size:18px;color:var(--fg);text-shadow:2px 2px 0 rgba(0,0,0,.45)}
button.skip{background:var(--pink)}
button.go{background:var(--green)}
button:focus-visible{outline:3px solid var(--fg);outline-offset:2px}

.history{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px}
.history li{display:flex;align-items:center;gap:12px;background:var(--track);min-height:38px;padding-right:10px;font-family:var(--pixel);font-size:15px;color:var(--muted);letter-spacing:.03em}
.history li::before{content:"";align-self:stretch;width:22px;background:var(--pink);flex:none}
.history li.answer{color:var(--fg)}
.history li.answer::before{background:var(--green)}
.history li.answer.lost::before{background:var(--pink)}

footer{margin-top:auto;padding-block:24px;font-family:var(--pixel);font-size:12px;color:var(--muted);letter-spacing:.03em;line-height:1.5}
footer a{color:inherit}
footer p{margin:0}
footer .more{margin-bottom:14px;font-family:var(--pixel);font-size:15px;line-height:1.6;color:var(--fg);letter-spacing:.03em}
footer .more a{font-family:var(--button);font-size:10px;letter-spacing:0;color:var(--green);text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
footer .more a:hover,footer .more a:focus-visible{color:var(--fg)}
</style>
</head>

// Publisher names as they appear in the Sheet, tidied for the clue chip.
const PUB_FIX = [[/^(SCEA|SIE|Sony Interactive Entertainment|PlayStation( Studios)?)$/i,'Sony'],[/^capcom\b.*/i,'Capcom'],[/^bandai namco\b.*/i,'Bandai Namco'],
  [/^(microsoft( game studios)?|xbox game studios)$/i,'Xbox Game Studios'],[/^bethesda$/i,'Bethesda Softworks'],[/^spike chunsoft\b.*/i,'Spike Chunsoft'],

function cleanPub(p){ p=String(p||'').trim().replace(/[\s,]+$/,''); for(const [rx,v] of PUB_FIX) if(rx.test(p)) return v;
  return p.replace(/,?\s+(Inc\.?|Ltd\.?|LLC|Co\.?,? Ltd\.?)$/i,''); }

// Endless: shuffled bag so nothing repeats until every cover has been shown.
// For the daily version, replace pickGame() with a date-seeded pick.
let bag = [];
function pickGame(){
  if(!bag.length){ bag = GAMES.map((_,i)=>i); for(let i=bag.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[bag[i],bag[j]]=[bag[j],bag[i]];} }
  return GAMES[bag.pop()];
}

let game, round, done, won, deaths, focus;

function layout(){
  if(!game) return;
  const img=$('art'), v=$('viewer'), V=v.clientWidth, {w,h}=game, f=focus;
  const z=ZOOM[round];
  if(z===null || done){
    const s=Math.min(V/w,V/h);
    setImg(img, w*s, h*s, (V-w*s)/2, (V-h*s)/2);
    v.classList.remove('pix'); return;
  }
  v.classList.toggle('pix', round===0);
  const win=z*Math.min(w,h), scale=V/win, d=DRIFT[round];
  let cx=(f[0]+(0.5-f[0])*d)*w, cy=(f[1]+(0.5-f[1])*d)*h;
  cx=Math.max(win/2,Math.min(w-win/2,cx)); cy=Math.max(win/2,Math.min(h-win/2,cy));
  setImg(img, w*scale, h*scale, -(cx-win/2)*scale, -(cy-win/2)*scale);
}
function setImg(img,W,H,x,y){ img.style.width=W+'px'; img.style.height=H+'px'; img.style.transform=`translate(${x}px,${y}px)`; }

function render(){
  const c=$('clues'); c.innerHTML='';
  const add=t=>{const s=document.createElement('span');s.className='chip';s.textContent=t;c.appendChild(s);};
  if(round>=1||done) add(String(game.y));
  if(round>=2||done){ add(game.c); if(game.p) add(cleanPub(game.p)); }

  $('viewer').classList.toggle('last', round===4 && !done);
  $('fill').style.width=(deaths/5*100)+'%';
  $('fill').innerHTML = deaths ? `<span>${deaths} DEATH${deaths===1?'':'S'}</span>` : '';
  $('zero').hidden = deaths>0;

  $('guess').hidden=done; $('winText').hidden=!done;
  $('winText').textContent = won ? (deaths===0 ? 'WOAH!' : 'WIN!') : 'GAME OVER';
  $('buttons').classList.toggle('one',done);
  $('skip').hidden=done;
  $('go').textContent = done ? 'NEXT' : 'GUESS';
}

function newGame(){
  game=pickGame(); round=0; done=false; won=false; deaths=0;

  const img=$('art');
  img.style.visibility='hidden'; $('loading').hidden=false;
  const g=game; let src=0;
  img.onload=()=>{ if(g!==game) return;
    game.w=img.naturalWidth||game.w; game.h=img.naturalHeight||game.h;   // real size, whichever source loaded
    $('loading').hidden=true; layout(); img.style.visibility='visible'; };
  img.onerror=()=>{ if(g!==game) return;
    if(g.k==null) while(++src<ART_SOURCES.length){ const u=ART_SOURCES[src](g); if(u){ img.src=u; return; } }
    newGame(); };                                                       // no art anywhere: skip to another game
  if(g.k!=null){                                                       // retro covers are bundled in pack files
    getPack(g.k).then(d=>{ if(g!==game) return; if(d[g.id]) img.src=d[g.id]; else newGame(); }).catch(()=>{ if(g===game) newGame(); });
  } else img.src=ART_SOURCES[0](g);
  render();
}

function addHistory(text,cls){ const li=document.createElement('li'); if(cls) li.className=cls; li.textContent=text; $('history').prepend(li); }

function die(label){
  deaths++; addHistory(label);
  if(round===4){ finish(false); return; }
  round++; layout(); render();
}

function guess(raw){
  if(done) return;
  const g=raw.trim(); if(!g) return;
  hideSuggest(); $('guess').value='';
  if(accepts(game).has(norm(g))){ finish(true); return; }
  die(g);
}

function finish(w){
  done=true; won=w; hideSuggest();
  addHistory(`${game.t} · ${game.c} ${game.y}`, 'answer'+(w?'':' lost'));
  layout(); render(); $('go').focus();
  if(w){ if(deaths===0) missiles(); else confetti(); }
  else gameOver();
}

// Game over: two quick white flashes, a screen shake, and gray pixels bursting out of the sides (same as Meta Critical).
function gameOver(){
  if(reduced) return;
  const f=$('flash');
  f.classList.remove('go'); void f.offsetWidth; f.classList.add('go');
  const a=document.querySelector('.app');
  a.classList.remove('shake'); void a.offsetWidth; a.classList.add('shake');
  confetti(['#5a5a5a','#7a7a7a','#9a9a9a','#bdbdbd','#3f3f3f']);
}

// Pixel confetti: same-size bright squares fire in from both sides, then fall.
let confettiRun=0;
function confetti(palette){
  if(reduced) return;
  const cv=$('confetti'), ctx=cv.getContext('2d'), P=4, S=2; // S = square size in game pixels
  const W=Math.ceil(innerWidth/P), H=Math.ceil(innerHeight/P);
  cv.width=W; cv.height=H; cv.hidden=false;
  const cols=palette||['#ff2e88','#ffe14d','#3cff8f','#2ee6ff','#7a5cff','#ff8a2e','#ffffff'];
  const bits=[];
  for(let i=0;i<140;i++){
    const left=i%2===0;
    bits.push({x:left?-S:W, y:H*(0.35+Math.random()*0.35),
      vx:(left?1:-1)*(1.2+Math.random()*2.6), vy:-(1.5+Math.random()*2.8),
      c:cols[Math.random()*cols.length|0], d:Math.random()*14|0});
  }
  const id=++confettiRun; let t=0;
  (function tick(){
    if(id!==confettiRun) return;
    ctx.clearRect(0,0,W,H); let alive=0;
    for(const b of bits){
      if(t<b.d){alive++;continue;}
      b.vy+=0.09; b.vx*=0.985; b.x+=b.vx; b.y+=b.vy;
      if(b.y<H+S){alive++; ctx.fillStyle=b.c; ctx.fillRect(Math.round(b.x),Math.round(b.y),S,S);}
    }
    t++;
    if(alive) requestAnimationFrame(tick); else cv.hidden=true;
  })();
}

// Win effect, Missile Command style: missiles streak up from the ground, each bursts into a flickering pixel blast.
function missiles(){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const cv=$('confetti'), ctx=cv.getContext('2d'), P=4; // one game pixel = 4 screen px
  const W=Math.ceil(innerWidth/P), H=Math.ceil(innerHeight/P);
  cv.width=W; cv.height=H; cv.hidden=false;
  const trailCols=['#ff3b6b','#ffd23b','#3bff9a','#3bd8ff','#c46bff'];
  const flash=['#ffffff','#ffd23b','#ff3b6b','#3bd8ff','#3bff9a','#c46bff'];
  const ms=[];
  for(let i=0;i<14;i++){
    const sx=Math.round(W*(0.1+Math.random()*0.8)), tx=Math.round(W*(0.08+Math.random()*0.84)), ty=Math.round(H*(0.12+Math.random()*0.5));
    const dist=Math.hypot(tx-sx,ty-H), sp=2.2+Math.random()*1.2;
    ms.push({sx,sy:H,tx,ty,len:dist,p:0,sp,start:i*7+(Math.random()*5|0),c:trailCols[i%trailCols.length],boom:-1,R:5+(Math.random()*4|0)});
  }
  const id=++confettiRun; let t=0;
  function disc(cx,cy,r,col){
    ctx.fillStyle=col; const r2=r*r;
    for(let dy=-r;dy<=r;dy++){ const w=Math.floor(Math.sqrt(r2-dy*dy)); ctx.fillRect(cx-w,cy+dy,w*2+1,1); }
  }
  (function tick(){
    if(id!==confettiRun) return;
    ctx.clearRect(0,0,W,H); let alive=0;
    for(const m of ms){
      if(t<m.start){alive++;continue;}
      if(m.boom<0){
        m.p=Math.min(m.len,m.p+m.sp);
        const k=m.p/m.len, hx=Math.round(m.sx+(m.tx-m.sx)*k), hy=Math.round(m.sy+(m.ty-m.sy)*k);
        // pixel trail
        ctx.fillStyle=m.c; const steps=Math.ceil(m.p);
        for(let s=0;s<=steps;s++){ const q=s/m.len; ctx.fillRect(Math.round(m.sx+(m.tx-m.sx)*q),Math.round(m.sy+(m.ty-m.sy)*q),1,1); }
        ctx.fillStyle='#ffffff'; ctx.fillRect(hx,hy,1,1);
        if(m.p>=m.len) m.boom=0;
        alive++;
      } else if(m.boom<44){
        const b=m.boom, r=Math.round(b<18?m.R*b/18:b<26?m.R:m.R*(44-b)/18);
        if(r>0) disc(m.tx,m.ty,r,flash[(b>>1)%flash.length]);
        m.boom++; alive++;
      }
    }
    t++;
    if(alive) requestAnimationFrame(tick); else cv.hidden=true;
  })();
}

// Autocomplete
let sel=-1;
function hideSuggest(){ $('suggest').hidden=true; sel=-1; }
function updateSuggest(){
  const q=norm($('guess').value), ul=$('suggest'); ul.innerHTML=''; sel=-1;
  if(q.length<2){hideSuggest();return;}
  const m=titles.filter(t=>norm(t).includes(q)).slice(0,8);
  if(!m.length){hideSuggest();return;}
  m.forEach(t=>{const li=document.createElement('li');li.textContent=t;li.onmousedown=e=>{e.preventDefault();guess(t);};ul.appendChild(li);});
  ul.hidden=false;
}
$('guess').addEventListener('input',updateSuggest);
$('guess').addEventListener('blur',()=>setTimeout(hideSuggest,100));
$('guess').addEventListener('keydown',e=>{
  const items=[...$('suggest').children]; if($('suggest').hidden||!items.length) return;
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); sel=(sel+(e.key==='ArrowDown'?1:-1)+items.length)%items.length; items.forEach((li,i)=>li.classList.toggle('on',i===sel)); }
  else if(e.key==='Enter'&&sel>=0){ e.preventDefault(); guess(items[sel].textContent); }
  else if(e.key==='Escape') hideSuggest();
});
$('guessForm').addEventListener('submit',e=>{e.preventDefault();guess($('guess').value);});
$('go').onclick=()=>{ if(done){ confettiRun++; $('confetti').hidden=true; newGame(); } else guess($('guess').value); };
$('skip').onclick=()=>{ if(!done) die('Skipped'); };

// Fit the title to the column width.
function fitTitle(){
  const h=$('title'), box=h.parentElement, avail=box.clientWidth-parseFloat(getComputedStyle(box).paddingLeft)-parseFloat(getComputedStyle(box).paddingRight)-4;
  // Size ZOOM so its letters are exactly as tall as BOX ART's, and sit on the same top and bottom lines.
  try{
    const cx=document.createElement('canvas').getContext('2d');
    const m=(font,txt)=>{cx.font='100px '+font; const r=cx.measureText(txt); return {a:r.actualBoundingBoxAscent/100, d:r.actualBoundingBoxDescent/100};};
    const B=m('"Jersey 25"','BOX ART'), Z=m('"Press Start 2P"','ZOOM');
    if(B.a+B.d>0 && Z.a+Z.d>0){
      const ratio=(B.a+B.d)/(Z.a+Z.d);        // zoom size relative to box size
      const z=$('zoomWord'), boxEm=1.75;      // .box is 1.75em of the h1
      z.style.fontSize=(boxEm*ratio)+'em';
      z.style.top=((B.d*boxEm - Z.d*boxEm*ratio)/(boxEm*ratio))+'em'; // line up the bottoms
    }
  }catch(e){}
  h.style.fontSize='40px'; const fs=40*avail/h.scrollWidth; h.style.fontSize=fs+'px';
  // Muted rainbow trail behind ZOOM: steps down-right until it slides under the art window.
  const cols=['#8a7440','#6a6a30','#3f6a40','#2f5a6e','#3c3c78','#5a3070','#6e2f48','#6a3a2a'];
  const step=Math.max(2,Math.round(fs/16)), n=Math.ceil(70/step);
  trail=[];
  for(let i=1;i<=n;i++){ const c=cols[Math.floor((i-1)/2)%cols.length]; trail.push(`${i*step}px ${i*step}px 0 ${c}`); }
  if(!punching) showTrail(trail.length);
}
let trail=[], punching=false, punchTimer=0;
function showTrail(k){ // k = how many layers are visible, counted from the deepest one
  const z=$('zoomWord'); z.style.textShadow = k>0 ? trail.slice(trail.length-k).join(',') : 'none';
  z.classList.toggle('lit', k>=trail.length && !punching);
}
// Punch-in: the deepest color appears first, each layer steps up toward the letters, white lands last.
function punchIn(){
  clearInterval(punchTimer);
  if(matchMedia('(prefers-reduced-motion: reduce)').matches || !trail.length){ punching=false; showTrail(trail.length); return; }
  punching=true; let k=0; showTrail(0);
  punchTimer=setInterval(()=>{
    k++;
    if(k>trail.length){ clearInterval(punchTimer); punching=false; showTrail(trail.length); return; }
    showTrail(k);
  },35);
}
addEventListener('resize',()=>{ fitTitle(); layout(); });
(document.fonts?document.fonts.ready:Promise.resolve()).then(()=>{ fitTitle(); punchIn(); });
fitTitle();

// ---------- Live data from Meta Critical's published Google Sheet ----------
// The list above is the backup. When this page is hosted on the web (for example next to Meta Critical on GitHub),
// the Sheet's title, year, console and publisher replace the built-in ones for every game above.
const SHEET_CSV='https://docs.google.com/spreadsheets/d/e/2PACX-1vQi3J4Jzq-9-MuUVnWY8n633DX_VSl_90GPF0ZgGq6ZGDXmHJ-gPkyXVtg9w7pI3diLxTDCARU42d2Y/pub?gid=892355712&single=true&output=csv';
function parseCSV(text){
  const rows=[]; let row=[], f='', q=false;
  for(let i=0;i<text.length;i++){ const c=text[i];
    if(q){ if(c==='"'){ if(text[i+1]==='"'){ f+='"'; i++; } else q=false; } else f+=c; }
    else if(c==='"') q=true;
    else if(c===','){ row.push(f); f=''; }
    else if(c==='\n'||c==='\r'){ if(c==='\r'&&text[i+1]==='\n') i++; row.push(f); rows.push(row); row=[]; f=''; }
    else f+=c; }
  if(f!==''||row.length){ row.push(f); rows.push(row); }
  return rows;
}
fetch(SHEET_CSV,{cache:'no-store'})
  .then(res=>{ if(!res.ok) throw new Error('HTTP '+res.status); return res.text(); })
  .then(text=>{
    const rows=parseCSV(text), head=(rows.shift()||[]).map(x=>x.trim().toLowerCase()), col=n=>head.indexOf(n);
    if(col('opencritic_id')<0 || col('game')<0) throw new Error('Sheet is missing columns');
    const get=(r,n)=>{ const i=col(n); return i<0 ? '' : String(r[i]||'').trim(); };
    const byId=new Map(GAMES.map(g=>[g.id,g])), off=new Set(); let n=0;
    for(const r of rows){ const g=byId.get(parseInt(get(r,'opencritic_id'),10)); if(!g) continue;
      const t=get(r,'game'), y=parseInt(get(r,'year_clue')||get(r,'year'),10), c=get(r,'platform_clue')||get(r,'platforms'), p=get(r,'publisher'), b=get(r,'box_art_url');
      if(t) g.t=t; if(y) g.y=y; if(c) g.c=c; if(p) g.p=p; if(b) g.b=b; n++;
      if(/^\s*no\s*$/i.test(get(r,'in zoom'))) off.add(g.id); }               // "in ZOOM" column: "no" leaves the game out (blank or "yes" keeps it)
    if(!n) throw new Error('No matching games in the Sheet');
    titles=[...new Set([...GAMES.map(g=>g.t), ...DECOYS])].sort((a,b)=>a.localeCompare(b));
    if(off.size){ GAMES=GAMES.filter(g=>!off.has(g.id)); bag=[]; }
    if(game && off.has(game.id) && !done) newGame();
    else if(game && !done) render();
  })
  .catch(err=>console.warn('Using the built-in game list:', err.message));

newGame();
